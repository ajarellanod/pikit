# yaml-language-server: $schema=../schema/preset.schema.json
# An agent in Telegram, on Cloudflare (SPEC §4, C1):
#   pikit new my-bot --target durable --preset telegram-cloudflare
#   pikit configure   # the bot's token, who may talk to it, the webhook's secret, the model's key
#   pikit up          # deploy, wait until /health answers the new version, then set the webhook
# deployment-cloudflare's README, "Your Telegram bot on Cloudflare", walks through it.
#
# A base, not an alias of cloudflare-minimal: an alias only answers its base's questions (`choose`),
# and cloudflare-minimal asks none. `pikit add` puts each half in its App (C1): secrets-cloudflare and
# platform-cloudflare in both, channel-telegram-webhook's Worker half in the Worker's, everything else
# in each conversation's Durable Object. Offered along the way (`pikit add` offers a provider for what is missing): outbound-durable, for the
# channel's answers, its retries woken by the object's alarm (platform-cloudflare's `wakeups`). The starter agent's model is OpenRouter's (provider-anthropic takes only API keys on Cloudflare),
# and it names every tool below, and pikit-self (extension-pikit-self: what it is made of, and how
# each part is changed).
title: "Telegram on Cloudflare: a Worker, and a Durable Object per chat"
components:
  - secrets-cloudflare
  - platform-cloudflare
  - storage-do
  - storage-kv-sql
  - provider-openrouter
  - runtime-pi
  # After the runtime: the registry creates conversations through its `agent.conversations`.
  - conversations-kv
  - router-basic
  - channel-telegram-webhook
  - execution-do
  - tool-read
  - tool-write
  - tool-edit
  - tool-bash
  - tool-fetch
  - tool-websearch-brave
  - extension-pikit-self
  - deployment-cloudflare
# Asked only once Cloudflare has a second channel: the webhook is its only one, and one answer is
# not a question. Then several at once, as on a server.
choose:
  - kind: channel
    question: "Where do you want to talk to your agent?"
    multiple: true
# What `pikit new` offers to add, several at once, with the dashboard (`--ui`): each by its `title`,
# `--with <component>` in a script. tool-fetch and tool-websearch-brave are installed above already.
# admin-proposals (self-improvement) starts dormant: it is connected after deploying, with github-app
# (its group): the dashboard's Settings → GitHub → Connect creates a GitHub App in the operator's
# account and installs it on the repository, and the app mints its own tokens.
features:
  - router-rules
  # A group: agents made and edited in the dashboard, and the routing rules that send a channel, chat or
  # person to one (both live, as settings), offered as agents-live's title. settings-store comes with the
  # dashboard; listed so the group composes without one (`pikit ui on` adds the rest later).
  - [agents-live, router-rules, settings-store]
  - tool-mcp
  - health-registry
  - [admin-proposals, github-app]
