# yaml-language-server: $schema=../schema/preset.schema.json
# An agent over HTTP, run in Docker: `pikit new my-agent --preset http`.
# A preset is only the list of `pikit add` calls, in order. Nothing branches on which preset a
# project came from. Its composition is samples/http's, plus the deployment and the log lines, with
# the neutral conversation registry (conversations-kv over storage-kv-sql, SPEC C5) where the sample
# keeps conversations-file, the registry's other provider, so both stay run end to end.
# The agents (src/agents/, src/extensions/agents.ts) belong to the project, not to the registry.
# `title` is what `pikit new` shows if it asks which preset to start from (only with several bases).
title: "An agent, run in Docker"
components:
  - secrets-env
  # Named, not left to `pikit add` to offer: an offer needs the registry's only server provider of
  # `storage.sql`, and a second one (storage-postgres) would leave every project of this preset with
  # none. The runtime keeps its conversations here (pi-durable's tables) and its answers log; a chat
  # channel's outbox keeps its own too, and stays offered, as it has one provider, on top of whichever
  # storage.
  - storage-sqlite
  # Named for the same reason: `storage.kv` over the storage above. The conversation registry keeps
  # its pointers there, and a chat channel its cursor.
  - storage-kv-sql
  - credentials-file
  - provider-anthropic
  - execution-local
  - tool-read
  - tool-write
  - tool-edit
  # Installed, but the starter agent does not name it on a server: a shell runs as the server's user
  # (its README). Add "bash" to an agent's `tools` to give it one.
  - tool-bash
  - runtime-pi
  # After the runtime: the registry creates conversations through its `agent.conversations`.
  - conversations-kv
  - router-basic
  # A chat channel chosen instead brings durable delivery with it (`outbound.queue` is offered by
  # `pikit add`, with wakeups-timers to wake its retries): channel-http answers in the HTTP response
  # and needs none.
  - channel-http
  - server-bun
  - log-events
  - deployment-docker
# One question of `pikit new` per entry: every registry component of that kind is an answer (its
# `title` in component.json is the label), and the one listed above is the default. A new channel-*
# component is an answer without touching this file. `--with <component>` answers it in a script.
# `multiple`: several channels at once (`--with channel-telegram --with channel-http`), all of them
# in place of channel-http; HTTP is served by server-bun, Telegram's polling needs no server.
choose:
  - kind: channel
    question: "Where do you want to talk to your agent?"
    multiple: true
# What `pikit new` offers to add, several at once, with the dashboard (`--ui`): each by its `title`,
# `--with <component>` in a script. Each brings what it needs, as `pikit add` would.
features:
  - router-rules
  - tool-mcp
  - tool-fetch
  - tool-websearch-brave
  - health-registry
