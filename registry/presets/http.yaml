# An agent over HTTP, run in Docker (SPEC §11): `pikit new my-agent --preset http`.
# A preset is only the list of `pikit add` calls, in order. Nothing branches on which preset a
# project came from. Its composition is samples/http's, plus the deployment and the log lines.
# The agents (src/agents/, src/extensions/agents.ts) belong to the project, not to the registry.
components:
  - secrets-env
  - sessions-jsonl
  - conversations-file
  - credentials-file
  - provider-anthropic
  - execution-local
  - tool-read
  - tool-write
  - tool-edit
  - tool-bash
  - runtime-pi
  - router-basic
  - channel-http
  - server-bun
  - log-events
  - deployment-docker
