<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" role="img" aria-label="Pikit: Pi as a service. Built from parts you own.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E7EC"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="4" fill="#000000" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="brick" gradientUnits="userSpaceOnUse" x1="20" y1="18" x2="60" y2="62">
      <stop offset="0" stop-color="#FFDF5C"/>
      <stop offset="0.55" stop-color="#F7BE0C"/>
      <stop offset="1" stop-color="#E9A100"/>
    </linearGradient>
    <linearGradient id="leg" gradientUnits="userSpaceOnUse" x1="40" y1="50" x2="70" y2="108">
      <stop offset="0" stop-color="#44444B"/>
      <stop offset="0.6" stop-color="#222226"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="stud" x1="0" x2="1">
      <stop offset="0" stop-color="#FFF1B3"/>
      <stop offset="0.45" stop-color="#FFC81F"/>
      <stop offset="1" stop-color="#D99400"/>
    </linearGradient>
    <radialGradient id="studTop" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFCEB"/>
      <stop offset="1" stop-color="#FFD640"/>
    </radialGradient>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurM" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <clipPath id="legs">
      <path d="M48 55L58 48V98L48 105Z"/>
      <rect x="32" y="55" width="16" height="50"/>
      <path d="M72 55L82 48H98V83Q98 91 106 91H112V99L102 106H92Q72 106 72 88Z"/>
    </clipPath>
    <radialGradient id="bgGlow" gradientUnits="userSpaceOnUse" cx="513" cy="247" r="620">
      <stop offset="0" stop-color="#FFE07A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFE07A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotFade" gradientUnits="userSpaceOnUse" cx="513" cy="300" r="820">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1800" height="600" fill="url(#dotFade)"/></mask>
    <clipPath id="tile"><rect width="1800" height="600" rx="48"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1800" height="600" fill="url(#bg)"/>
    <rect width="1800" height="600" fill="url(#bgGlow)"/>
    <rect width="1800" height="600" fill="url(#dots)" mask="url(#dotMask)"/>

